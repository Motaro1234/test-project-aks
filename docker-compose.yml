version: '3.8'

services:
  # 1. ส่วนของฐานข้อมูล (Postgres)
  db:
    image: postgres:15  # ใช้ Image สำเร็จรูปของ Postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. ส่วนของ Backend
  backend:
    build: ./backend  # ชี้ไปยังโฟลเดอร์ที่มี Dockerfile ของ Backend
    ports:
      - "8000:8000"
    depends_on:
      - db  # รอให้ Database เปิดขึ้นมาก่อน ค่อยเปิด Backend ตาม

  # 3. ส่วนของ Frontend
  frontend:
    build: ./frontend  # ชี้ไปยังโฟลเดอร์ที่มี Dockerfile ของ Frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend  # รอให้ Backend พร้อมทำงานก่อน

volumes:
  postgres_data:  # ช่วยเก็บข้อมูลในฐานข้อมูลไว้ ไม่ให้หายเวลาปิด Container