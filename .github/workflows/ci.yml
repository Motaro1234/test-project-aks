name: Build and Push Docker Image

on:
  push:
    branches:
      - second-R

env:
  IMAGE_NAME: webapp

jobs:
  # ---------- Job 1: Build + Push Image (รันทันที ไม่ต้องรอ approve) ----------
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login ACR
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Push Image
        run: |
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ---------- Job 2: Update Manifest + Deploy (ต้องรอ Approve เสมอ) ----------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Update Manifest Repository and Open PR
        env:
          GH_TOKEN: ${{ secrets.MANIFEST_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${{ secrets.MANIFEST_REPO_TOKEN }}@github.com/Motaro1234/test-project-aks-manifests.git

          cd test-project-aks-manifests

          BRANCH_NAME="deploy/${{ github.sha }}"
          git checkout -b "$BRANCH_NAME"

          sed -i "s#^\([[:space:]]*image:[[:space:]]*\).*#\1${{ secrets.ACR_NAME }}.azurecr.io/webapp:${{ github.sha }}#" deployment.yaml

          echo "===== deployment.yaml ====="
          cat deployment.yaml

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add deployment.yaml
          git status

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update image to ${{ github.sha }}"
          git push origin "$BRANCH_NAME"

          gh pr create \
            --repo Motaro1234/test-project-aks-manifests \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Deploy ${{ github.sha }}" \
            --body "Triggered by ${{ github.actor }} from workflow run ${{ github.run_id }}. Merge this PR to deploy to AKS via Argo CD."
          git checkout newrules